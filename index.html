<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dnyanjot Business</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-blue-600 text-white">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <a href="index.html" class="text-2xl font-bold">Dnyanjot</a>
      <div class="hidden md:flex space-x-6">
        <a href="index.html" class="hover:text-yellow-300">Home</a>
        <a href="about.html" class="hover:text-yellow-300">About</a>
        <a href="services.html" class="hover:text-yellow-300">Services</a>
        <a href="contact.html" class="hover:text-yellow-300">Contact</a>
      </div>
      <!-- Mobile menu button -->
      <button id="menu-btn" class="md:hidden focus:outline-none">
        ☰
      </button>
    </div>
    <!-- Mobile dropdown -->
    <div id="mobile-menu" class="hidden md:hidden bg-blue-700">
      <a href="index.html" class="block px-4 py-2 hover:bg-blue-500">Home</a>
      <a href="about.html" class="block px-4 py-2 hover:bg-blue-500">About</a>
      <a href="services.html" class="block px-4 py-2 hover:bg-blue-500">Services</a>
      <a href="contact.html" class="block px-4 py-2 hover:bg-blue-500">Contact</a>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="max-w-7xl mx-auto p-6">
    <h1 class="text-4xl font-bold mb-4">Welcome to Dnyanjot</h1>
    <p class="text-lg text-gray-700">Your trusted partner for innovative solutions.</p>
  </main>

  <!-- Footer -->
  <footer class="bg-blue-600 text-white text-center py-4 mt-10">
    © 2026 Dnyanjot Business. All rights reserved.
  </footer>

  <!-- JavaScript for mobile menu -->
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  </script>
</body>
</html>
